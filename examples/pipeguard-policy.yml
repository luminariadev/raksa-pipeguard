# Example .pipeguard.yml fail-closed waiver policy
# Suppressing noisy low/info checks requires explicit justification and a future ISO date (YYYY-MM-DD).

min_severity: low

suppressions:
  - rule_id: "PIPE-206"
    target_contains: "worker/Dockerfile"
    reason: "Queue worker has no network listener and health is supervised by process runtime"
    expires_on: "2027-06-30"
