name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  pipeguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # For production SLSA L3 / PIPE-404 compliance, pin to the full 40-character commit SHA of the v0.3.0 release.
      - name: Run Raksa PipeGuard Gate
        uses: luminariadev/raksa-pipeguard@v0.3.0
        with:
          path: .
          mode: repo
          format: sarif
          fail-on: high
          # Optional KEV/EPSS enrichment, PR diff scoping, or Markdown summary:
          # online-kev: "true"
          # online-epss: "true"
          # diff-base: origin/main
          output: pipeguard.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pipeguard.sarif
